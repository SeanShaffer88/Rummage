name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 -I tools/check.py
      - name: Tag must match the TOC version
        run: |
          VER="$(sed -n 's/^## Version:[[:space:]]*//p' Rummage/Rummage.toc | head -1 | tr -d '\r')"
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != TOC version v$VER"; exit 1; }
      - run: sh tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk '/^## /{n++} n==1' Rummage/CHANGELOG.md > dist/notes.md
          gh release create "${GITHUB_REF_NAME}" dist/Rummage-*.zip dist/SHA256SUMS.txt \
            --title "Rummage ${GITHUB_REF_NAME#v}" --notes-file dist/notes.md --verify-tag
