name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - run: python3 -I tools/check.py
      - name: Publication helper tests (fake API only)
        run: python3 -I tools/tests/test_publish_release.py
      - name: Tag must match the TOC version
        run: |
          VER="$(sed -n 's/^## Version:[[:space:]]*//p' Rummage/Rummage.toc | head -1 | tr -d '\r')"
          [ "v$VER" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != TOC version v$VER"; exit 1; }
      - run: sh tools/package.sh
      - name: Verify or publish missing release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I tools/publish_release.py --repo "${GITHUB_REPOSITORY}" --tag "${GITHUB_REF_NAME}"
