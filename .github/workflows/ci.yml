name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install lupa
      - name: Gate (compile, TOC lint, headers, tests)
        run: python3 -I tools/check.py
      - name: Package (dry run)
        run: sh tools/package.sh
